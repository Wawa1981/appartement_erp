name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_appartement_erp
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set environment variables
        run: |
          echo "DEBUG=False" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-secret-key-for-tests-only" >> $GITHUB_ENV
          echo "DATABASE_URL=postgres://test_user:test_password@localhost:5432/test_appartement_erp" >> $GITHUB_ENV

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests (if any)
        working-directory: backend
        run: python manage.py test --verbosity=2 || echo "No tests yet - this is OK for Sprint 0"

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present || echo "No lint script or lint passed"

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all services
        run: docker compose build --no-cache

      - name: Quick health check (start db + backend)
        run: |
          docker compose up -d db backend
          sleep 15
          docker compose ps
          docker compose exec -T backend python manage.py check
        env:
          POSTGRES_DB: appartement_erp
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: test-ci-password
          SECRET_KEY: ci-test-secret
          DEBUG: "False"
